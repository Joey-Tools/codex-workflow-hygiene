name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep 15.2.0
        env:
          RIPGREP_ARCHIVE: ripgrep-15.2.0-x86_64-unknown-linux-musl.tar.gz
          RIPGREP_ARCHIVE_SHA256: 33e15bcf1624b25cdd2a55813a47a2f95dbe126268203e76aa6a585d1e7b149c
        run: |
          archive="$RUNNER_TEMP/$RIPGREP_ARCHIVE"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/BurntSushi/ripgrep/releases/download/15.2.0/$RIPGREP_ARCHIVE"
          printf '%s  %s\n' "$RIPGREP_ARCHIVE_SHA256" "$archive" \
            | sha256sum --check --status
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          bin_dir="$RUNNER_TEMP/${RIPGREP_ARCHIVE%.tar.gz}"
          "$bin_dir/rg" --version
          printf '%s\n' "$bin_dir" >> "$GITHUB_PATH"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run tests
        run: |
          python3 -m unittest discover -s tests
