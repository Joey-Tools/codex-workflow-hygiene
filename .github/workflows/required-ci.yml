name: Required CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Reject unexpected repository
        if: ${{ github.repository != 'Joey-Tools/codex-workflow-hygiene' }}
        run: exit 1
      - uses: actions/checkout@v4
        with:
          repository: Joey-Tools/codex-workflow-hygiene
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run tests
        run: |
          python3 -m unittest discover -s tests
